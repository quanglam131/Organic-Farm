# Render Blueprint (https://render.com/docs/blueprint-spec): one Docker web service.
# The database is an online MySQL (Aiven, Railway, PlanetScale or a VPS), not XAMPP (Tuần 7).
# Every secret is marked sync: false, so it is typed in the Render dashboard and never stored in Git.
services:
  - type: web
    name: nong-trai-xanh
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: "Nong trai Xanh"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false            # php artisan key:generate --show
      - key: APP_URL
        sync: false            # https://<service>.onrender.com
      - key: FRONTEND_URL
        sync: false            # same as APP_URL (the React app is served by Laravel)
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        sync: false            # path to the CA file if the provider requires TLS
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: SANCTUM_EXPIRATION
        value: "480"
      - key: PAYMENT_MOCK_ENABLED
        value: "false"
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_RETURN_URL
        sync: false            # https://<service>.onrender.com/api/payments/vnpay/return
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: MAIL_MAILER
        value: log
